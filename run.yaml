apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: juphc-tc-pipeline-run-
spec:
  pipelineRef:
    name: juphc-tc-pipeline
  params:
    - name: repo-url
      value: https://github.com/jawariaqazi585-ai/zntwk-tax_calculator.git
    - name: branch
      value: main
    - name: build-image
      value: us.icr.io/sn-labs-jawariaqazi5/tax-calculator
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
    - name: dockerconfig-ws
      secret:
        secretName: icr-secret-new
